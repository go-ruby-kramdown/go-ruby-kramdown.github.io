baseURL = "https://go-ruby-kramdown.github.io/"
title = "go-ruby-kramdown"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Pure Go, zero cgo"
  status = "ready"
  blurb = "`kramdown` builds with `CGO_ENABLED=0` — it cross-compiles to every Go target with no C toolchain and links into a single static binary."

[[params.phases]]
  name = "Reference-faithful"
  status = "ready"
  blurb = "Mirrors the observable behaviour of Ruby's `kramdown` from reference Ruby (MRI), validated by a differential oracle against the reference rather than approximated — **without any Ruby runtime**."

[[params.phases]]
  name = "Corpus conformance · 99.49%"
  status = "ready"
  blurb = "**197 of 198** shared-corpus cases render byte-exact against the Ruby `kramdown` 2.5.2 gem, locked by a shrink-only ratchet. Ported: the full `Parser::Html` raw-HTML front-end + `html_to_native`, table-of-contents, the 905-entry HTML entity table, footnotes, smart quotes, header options, transliterated IDs, CJK line-breaks, LaTeX **math** (MathJax-wrapped), **IAL/ALD** attribute lists, and **Rouge** syntax highlighting (including the PHP lexer)."

[[params.phases]]
  name = "Remaining 1 case"
  status = "active"
  blurb = "Not spec-complete, but the single open case (`rouge/multiple`) is a test-harness artifact: it names a custom Rouge formatter class defined only inside kramdown's own Ruby test suite (`test/test_files.rb`), not a library feature, so no pure-Go wiring can supply it. Its three code blocks already tokenise byte-for-byte; only the harness-injected wrapper div is unreachable."

[[params.phases]]
  name = "Standalone & reusable"
  status = "ready"
  blurb = "A standalone Go module any program can import; the OAuth-style dependency runs the other way — `rbgo` binds it into [go-embedded-ruby](https://github.com/go-embedded-ruby/ruby) as a native module, the same pattern as go-ruby-yaml."

[[params.phases]]
  name = "100% coverage · 6 arches"
  status = "ready"
  blurb = "100% test coverage is the CI gate, `gofmt` + `go vet` clean, green across the six 64-bit Go targets (amd64, arm64, riscv64, loong64, ppc64le, s390x — including the big-endian lane)."
